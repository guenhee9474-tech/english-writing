<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수행평가 채점 (교사용)</title>
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<!--
  영어 쓰기 수행평가 채점 화면. 선생님들이 자기 반을 골라 채점합니다.

  여는 법: 현황 화면(teacher.html) 위의 '채점' 단추. 현황 화면과 같은 열쇠로 grade.html#k=열쇠 를 엽니다.
  이 파일에는 열쇠가 들어 있지 않습니다(저장소가 공개라서). 학생에게 이 주소를 알려 주지 마세요.

  점수 (총 60점) — 규칙은 이 파일의 score() 한 곳:
    참여·준비도 24  : 1회차(초안)·2회차(최종) 둘 다 제출 24, 하나 16, 접속만 8, 미응시 0
    완성도·분량 12  : 최종 글 문장 9개 이상 12, 6~8 9, 3~5 6, 1~2 3
    표현 다양성 12  : 최종 제출했으면 12 (표현 개수는 참고)
    형식·문법성 12  : 선생님이 오류 수 입력 0~2 12, 3~5 9, 6~8 6, 9개 이상 3
    가감            : 선생님이 사유와 점수를 적어 더하거나 뺌 (사유 없는 줄은 저장 안 됨). 총점은 0~60 안으로.
  빨간 칠(AI 표시)은 선생님 PC의 Claude 가 만든 '의심' 표시일 뿐이고, 개수는 선생님이 셉니다.
  문장 나누기·Word Bank 규칙은 index.html 의 splitSentences·CONFIG.wordBank 와 같게 둡니다.

  보안: 학생 글·AI 표시·메모는 모두 textContent/escape 로만 화면에 넣습니다(innerHTML 에 날것으로 넣지 않음).
-->
<style>
  :root{
    --ink:#18202F; --ink2:#3A4457; --muted:#687386; --line:#E3E8EF; --line2:#D3DAE4; --bg:#F3F5F9; --card:#FFFFFF;
    --navy:#18202F; --blue:#2C5FD6; --blue-soft:#EAF0FD; --blue-ink:#1D4AB8;
    --amber:#A35F00; --amber-soft:#FFF3DC; --green:#0B7A63; --green-soft:#DEF3EC; --red:#B42318; --red-soft:#FDE9E7;
    --mk:#FFDCD6; --chk:#FFEFC2; --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
       background:var(--bg); color:var(--ink); -webkit-text-size-adjust:100%; word-break:keep-all; -webkit-font-smoothing:antialiased}
  button,input,textarea{font:inherit; color:inherit}
  button{cursor:pointer}
  .hint{color:var(--muted); font-size:13px}

  /* 머리 */
  header{position:sticky; top:0; z-index:10; background:var(--navy); color:#fff; padding:12px 20px 0}
  .top{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .top h1{font-size:18px; margin:0; letter-spacing:-.2px}
  .top .sub{color:#93A0B5; font-size:13px}
  .top .sp{margin-left:auto; display:flex; gap:10px; align-items:center; font-size:13px; color:#B7C1D1}
  .top button{border:1px solid #3A465C; background:#252F42; color:#fff; border-radius:10px; padding:6px 12px; font-size:13px}
  .tabs{display:flex; gap:4px; overflow-x:auto; padding:12px 0 0; scrollbar-width:none}
  .tabs button{flex:0 0 auto; background:transparent; color:#AEB8C8; border:0; border-radius:10px 10px 0 0; padding:9px 16px 10px; font-size:15px; font-weight:700}
  .tabs button:hover{color:#fff}
  .tabs button.on{background:var(--bg); color:var(--ink)}
  .tabs button .n{font-size:12px; color:#7D889B; margin-left:6px; font-weight:600}

  /* 반 막대 */
  .bar{display:flex; gap:18px; align-items:center; flex-wrap:wrap; padding:14px 20px 4px}
  .prog{display:flex; flex-direction:column; gap:6px; min-width:260px}
  #clsInfo{font-size:14px; color:var(--ink2); font-weight:600}
  .meter{height:8px; border-radius:999px; background:var(--line); overflow:hidden; width:min(340px, 60vw)}
  .meter i{display:block; height:100%; background:var(--green); border-radius:999px; transition:width .3s}
  .bar .sp{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .tool{border:1px solid var(--line2); background:var(--card); border-radius:10px; padding:8px 14px; font-size:14px; font-weight:600}
  .tool:hover{border-color:var(--ink2)}
  .pcheck{display:inline-flex; gap:6px; align-items:center; font-size:13px; color:var(--muted)}

  main{padding:12px 20px 40px; display:grid; grid-template-columns:250px minmax(0,1fr) 340px; gap:16px; align-items:start}
  @media (max-width:1320px){ main{grid-template-columns:200px minmax(0,1fr) 300px; gap:12px} .paper{padding:20px 22px} }
  @media (max-width:1060px){ main{grid-template-columns:200px minmax(0,1fr)} #score{grid-column:1 / -1; position:static} }
  @media (max-width:720px){ main{grid-template-columns:1fr} .list{max-height:240px} }

  /* 학생 목록 */
  .list{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); max-height:calc(100vh - 190px); overflow:auto; position:sticky; top:118px}
  .list button{display:grid; grid-template-columns:28px 1fr auto; gap:4px 8px; align-items:center; width:100%; text-align:left; padding:10px 12px; border:0;
               border-bottom:1px solid var(--line); background:var(--card); font-size:15px}
  .list button:last-child{border-bottom:0}
  .list button:hover{background:#F7F9FC}
  .list button.on{background:var(--blue-soft); box-shadow:inset 3px 0 0 var(--blue)}
  .list .n{color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums}
  .list .nm{display:flex; flex-direction:column; line-height:1.25}
  .list .st{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:5px; margin-top:2px}
  .list .st::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--line2)}
  .list .done .st::before{background:var(--green)} .list .need .st::before{background:var(--amber)}
  .list .need .st{color:var(--amber)}
  .list .t{font-weight:800; font-size:16px; font-variant-numeric:tabular-nums; color:var(--ink)}
  .list .need .t, .list .none .t{color:var(--muted); font-weight:600}

  /* 글 */
  .paper{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px 28px 26px; min-height:240px}
  .paper h2{margin:0; font-size:22px; letter-spacing:-.3px; display:flex; align-items:baseline; gap:10px}
  .paper h2 small{font-size:14px; color:var(--muted); font-weight:600; font-variant-numeric:tabular-nums}
  .meta{display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 18px}
  .chip{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; font-size:13px; font-weight:600; background:#EEF1F5; color:var(--ink2)}
  .chip.ok{background:var(--green-soft); color:var(--green)} .chip.no{background:#F1F2F4; color:#8D96A5}
  .meta a.chip{text-decoration:none; background:var(--blue-soft); color:var(--blue-ink)}
  .text{font:18px/1.95 Georgia,"Times New Roman",serif; white-space:pre-wrap; max-width:72ch; color:#151B26}
  .wb{text-decoration:underline 2px; text-decoration-color:#2FA37F; text-underline-offset:4px}
  .mk{background:var(--mk); border-radius:4px; padding:0 1px; cursor:help; transition:box-shadow .15s}
  .mk.chk{background:var(--chk)} .mk.hot{box-shadow:0 0 0 2px var(--red)}
  .mk sup{font:700 10px/1 system-ui,sans-serif; color:var(--red); margin-left:1px}
  .legend{display:flex; flex-wrap:wrap; gap:14px; margin:18px 0 0; font-size:12.5px; color:var(--muted)}
  .legend i{display:inline-block; width:22px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px}
  .wait{margin-top:14px; padding:10px 14px; border-radius:10px; background:var(--amber-soft); color:var(--amber); font-size:13px}
  .marks{list-style:none; margin:16px 0 0; padding:0; display:grid; gap:6px}
  .marks li{display:grid; grid-template-columns:24px auto 1fr; gap:4px 10px; align-items:baseline; padding:8px 12px; border-radius:10px; background:#F8F9FB; font-size:14px}
  .marks li:hover{background:#FFF1EE}
  .marks .no{font:800 12px/20px system-ui,sans-serif; color:#fff; background:var(--red); border-radius:999px; text-align:center; width:20px}
  .marks .k{font-size:11px; font-weight:800; padding:1px 7px; border-radius:999px; background:var(--line); color:var(--ink2); white-space:nowrap}
  .marks .fx{min-width:0}
  .marks del{color:var(--red)} .marks ins{color:var(--green); text-decoration:none; font-weight:700}
  .marks .w{display:block; color:var(--muted); font-size:12.5px; margin-top:1px}
  .empty{padding:48px 20px; text-align:center; color:var(--muted)}

  /* 점수 카드 */
  #score{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; position:sticky; top:118px}
  .tot{display:flex; align-items:flex-end; justify-content:space-between; gap:10px; padding-bottom:14px; border-bottom:1px solid var(--line)}
  .tot .lab{font-size:13px; color:var(--muted); font-weight:700}
  .tot .state{font-size:12.5px; margin-top:4px; color:var(--muted)} .tot .state.need{color:var(--amber); font-weight:700}
  .total{font-size:42px; font-weight:800; line-height:1; letter-spacing:-1px; font-variant-numeric:tabular-nums}
  .total small{font-size:16px; color:var(--muted); font-weight:700; letter-spacing:0}
  .sec{padding:14px 0; border-bottom:1px solid var(--line)}
  .sec h3{margin:0 0 10px; font-size:14px; display:flex; justify-content:space-between; align-items:baseline}
  .sec h3 span{font-size:12.5px; color:var(--muted); font-weight:600}
  .stepper{display:grid; grid-template-columns:52px 1fr 52px; gap:8px}
  .stepper button{height:52px; border-radius:12px; border:1px solid var(--line2); background:#F7F9FC; font-size:24px; font-weight:700; color:var(--ink2)}
  .stepper button:active{background:var(--blue-soft)}
  .stepper input{height:52px; text-align:center; font-size:26px; font-weight:800; border:2px solid var(--blue); border-radius:12px; -moz-appearance:textfield; min-width:0}
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
  .stepper input:disabled{border-color:var(--line2); background:#F3F5F8}
  .bands{display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin-top:10px}
  .bands span{text-align:center; padding:6px 0; border-radius:8px; background:#F3F5F8; font-size:12px; color:var(--muted); line-height:1.3}
  .bands span b{display:block; font-size:15px; color:var(--ink2)}
  .bands span.on{background:var(--blue); color:#E8EEFC} .bands span.on b{color:#fff}
  .part{display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; padding:8px 0}
  .part + .part{border-top:1px dashed var(--line)}
  .part b{font-size:14px; font-weight:700} .part small{display:block; color:var(--muted); font-size:12px; margin-top:2px}
  .pv{display:flex; align-items:center; gap:6px; font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums}
  .pv input{width:56px; height:38px; text-align:center; font-size:17px; font-weight:800; color:var(--ink); border:1px solid var(--line2); border-radius:10px; background:#F7F9FC; -moz-appearance:textfield}
  .pv input::-webkit-outer-spin-button, .pv input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
  .pv input::placeholder{color:var(--ink); opacity:1}
  .pv input.man{background:var(--amber-soft); border-color:#E7B766; color:var(--amber)}
  .pv .reset{border:0; background:none; color:var(--blue); font-size:12px; font-weight:700; padding:2px}
  .adj .row{display:grid; grid-template-columns:minmax(0,1fr) 64px 28px; gap:6px; margin-bottom:6px}
  .adj input{padding:7px 9px; border:1px solid var(--line2); border-radius:10px; min-width:0; font-size:14px}
  .adj .p{text-align:center; font-weight:700}
  .adj .del{border:0; background:none; color:var(--muted); font-size:18px}
  .adj .add{border:1px dashed var(--line2); background:none; border-radius:10px; padding:7px 12px; font-size:13px; font-weight:600; color:var(--ink2); width:100%}
  textarea{width:100%; border:1px solid var(--line2); border-radius:10px; padding:8px 10px; font-size:14px; resize:vertical}
  .foot{display:flex; align-items:center; gap:10px; padding-top:14px}
  .saved{font-size:12px; color:var(--green); font-weight:700}
  .next{margin-left:auto; border:0; background:var(--ink); color:#fff; border-radius:12px; padding:11px 18px; font-size:15px; font-weight:700}
  .next:disabled{opacity:.35}
  .err{background:var(--red-soft); color:var(--red); padding:12px 16px; margin:16px 20px; border-radius:12px}
  #tnote{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:12px; font-size:14px; z-index:20; box-shadow:0 8px 24px rgba(0,0,0,.18)}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>수행평가 채점</h1><span class="sub">영어 쓰기 · 60점</span>
    <div class="sp"><span id="fresh">불러오는 중…</span><button id="btnReload">새로 고침</button></div>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<div class="bar" id="bar" hidden>
  <div class="prog"><span id="clsInfo"></span><div class="meter" aria-hidden="true"><i id="meter" style="width:0"></i></div></div>
  <div class="sp">
    <label class="pcheck"><input type="checkbox" id="prMarks" checked> AI 표시 함께</label>
    <button class="tool" id="btnPrint">이 반 점수 붙은 제출물 인쇄</button>
    <button class="tool" id="btnXlsx">엑셀 (전체·반별)</button>
  </div>
</div>
<div id="msg"></div>
<main id="main" hidden>
  <nav class="list" id="list"></nav>
  <section class="paper" id="paper"><div class="empty">왼쪽에서 학생을 고르세요.</div></section>
  <aside id="score" hidden></aside>
</main>
<div id="tnote" hidden role="status"></div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzq2ub-CXiHUErkWcvN7YgPbNacIoDZZlT6jNsRSKB6G1nWOivxRzfjlAIp83kQdPvl4Q/exec";
const q = new URLSearchParams(location.search);
const KEY = q.get("k") || new URLSearchParams(location.hash.slice(1)).get("k") || "";
if (q.get("k")) { try { history.replaceState(null, "", location.pathname + "#k=" + encodeURIComponent(KEY)); } catch (e) {} }
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const note = (m) => { const n = $("tnote"); n.textContent = m; n.hidden = false; clearTimeout(note.t); note.t = setTimeout(() => (n.hidden = true), 3500); };

/* index.html CONFIG.wordBank 과 같게 */
const BANK = [
  ["inclusive", /\binclusive(?:ly|ness)?\b/i],
  ["accessible (to)", /\baccessib(?:le|ility)\b/i],
  ["regardless of", /\bregardless\s+of\b/i],
  ["benefit (from)", /\bbenefit(?:s|ed|ing|ted|ting)?\b/i],
  ["ensure / make sure that", /\b(?:ensur(?:e|es|ed|ing)|mak(?:e|es|ing)\s+sure|made\s+sure)\b/i],
  ["rely on", /\brel(?:y|ies|ied|ying)\s+on\b/i],
  ["make use of", /\b(?:make|makes|made|making)\s+use\s+of\b/i],
  ["make it easier for A to B", /\b(?:make|makes|made|making)\s+it\s+(?:much\s+|even\s+)?(?:easier|easy|difficult|harder|hard|possible|safer|safe|comfortable)\b/i],
  ["the reason why / a place where", /\b(?:reasons?\s+why|(?:place|places|room|rooms|space|spaces|area|areas|park|parks|school|library)\s+where)\b/i]
];
const PARTS = [["prep", "프로젝트 참여·준비도", 24], ["length", "글의 완성도·분량", 12], ["grammar", "글의 형식·문법성", 12], ["expr", "표현의 다양성", 12]];

/* index.html splitSentences 와 같게 */
function splitSentences(text) {
  const t = String(text || "").replace(/\s+/g, " ").trim();
  if (!t) return [];
  const out = [], re = /[^.!?]+(?:[.!?]+["')\]]*|$)/g;
  let m;
  while ((m = re.exec(t)) !== null) {
    if (m.index === re.lastIndex) { re.lastIndex++; continue; }
    const s = m[0].trim();
    if (/[A-Za-z]{2,}/.test(s)) out.push(s);
  }
  return out;
}
function bankSpans(text) {
  const spans = [];
  BANK.forEach(([, rx]) => { const g = new RegExp(rx.source, "gi"); let m; while ((m = g.exec(text)) !== null) { if (!m[0].length) { g.lastIndex++; continue; } spans.push([m.index, m.index + m[0].length]); } });
  return spans;
}
function score(s) {
  const g = s.g || {}, text = s.final || "";
  const submitted = !!s.fn && !!text.trim();
  const n = submitted ? splitSentences(text).length : 0;
  const used = submitted ? BANK.filter(([, rx]) => rx.test(text)).map(([l]) => l) : [];
  const done = (s.dr ? 1 : 0) + (s.fn ? 1 : 0);
  const errors = g.e === null || g.e === undefined || g.e === "" ? null : Number(g.e);
  const auto = {
    prep: !s.ph ? 0 : done === 2 ? 24 : done === 1 ? 16 : 8,
    length: n >= 9 ? 12 : n >= 6 ? 9 : n >= 3 ? 6 : n >= 1 ? 3 : 0,
    grammar: !submitted ? 0 : errors === null ? null : errors <= 2 ? 12 : errors <= 5 ? 9 : errors <= 8 ? 6 : 3,
    expr: submitted ? 12 : 0
  };
  const ov = g.ov || {}, parts = {};
  PARTS.forEach(([k]) => { parts[k] = Number.isInteger(ov[k]) ? ov[k] : auto[k]; });
  const pending = parts.grammar === null;
  const adj = (Array.isArray(g.adj) ? g.adj : []).filter((a) => a && a.r && Number(a.p)).map((a) => ({ r: String(a.r), p: Math.round(Number(a.p)) }));
  const adjSum = adj.reduce((t, a) => t + a.p, 0);
  const base = pending ? null : parts.prep + parts.length + parts.grammar + parts.expr;
  return { submitted, n, used, auto, parts, errors, pending, adj, adjSum, base, total: base === null ? null : Math.max(0, Math.min(60, base + adjSum)) };
}
/* 서버의 AI 표시 → 글 안 자리 확인 (자리가 글과 안 맞으면 인용으로 다시 찾고, 그래도 없으면 버림) */
function marksOf(s) {
  const text = s.final || "", raw = (s.g && Array.isArray(s.g.marks)) ? s.g.marks : [];
  const out = [];
  raw.forEach((m) => {
    let a = Number(m.s), b = Number(m.e);
    if (!(a >= 0 && b > a && b <= text.length && text.slice(a, b) === m.q)) { a = m.q ? text.indexOf(m.q) : -1; b = a + String(m.q || "").length; }
    if (a < 0 || out.some((x) => x.s < b && a < x.e)) return;
    out.push({ s: a, e: b, k: String(m.k || "확인"), q: String(m.q || ""), f: String(m.f || ""), w: String(m.w || "") });
  });
  return out.sort((x, y) => x.s - y.s);
}
function painted(text, marks) {
  const kind = new Array(text.length).fill(0);
  bankSpans(text).forEach(([a, b]) => { for (let i = a; i < b; i++) kind[i] = -1; });
  marks.forEach((m, n) => { for (let i = m.s; i < m.e; i++) kind[i] = n + 1; });
  let html = "", i = 0;
  while (i < text.length) {
    let j = i; while (j < text.length && kind[j] === kind[i]) j++;
    const piece = esc(text.slice(i, j)), k = kind[i];
    if (k > 0) { const m = marks[k - 1]; html += '<span data-n="' + k + '" class="mk' + (m.k === "확인" ? " chk" : "") + '" title="' + esc(m.k + ": " + m.f + " — " + m.w) + '">' + piece + "<sup>" + k + "</sup></span>"; }
    else if (k < 0) html += '<span class="wb">' + piece + "</span>";
    else html += piece;
    i = j;
  }
  return html;
}
function marksList(marks) {
  return marks.length ? '<ol class="marks">' + marks.map((m, i) => '<li data-n="' + (i + 1) + '"><span class="no">' + (i + 1) + '</span><span class="k">' + esc(m.k) + '</span><span class="fx"><del>' + esc(m.q) + "</del> → <ins>" + esc(m.f) + '</ins><span class="w">' + esc(m.w) + "</span></span></li>").join("") + "</ol>" : "";
}

const xe = (s) => String(s).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function col(i) { let s = ""; i++; while (i) { const r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); } return s; }
function sheetXml(t) {
  const body = t.map((row, r) => '<row r="' + (r + 1) + '">' + row.map((v, c) => {
    const ref = col(c) + (r + 1), st = r === 0 ? ' s="1"' : "";
    if (v === "" || v === null || v === undefined) return '<c r="' + ref + '"' + st + "/>";
    if (typeof v === "number") return '<c r="' + ref + '"' + st + "><v>" + v + "</v></c>";
    return '<c r="' + ref + '" t="inlineStr"' + st + '><is><t xml:space="preserve">' + xe(v) + "</t></is></c>";
  }).join("") + "</row>").join("");
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>' +
    WIDTH.map((w, i) => '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>').join("") + "</cols><sheetData>" + body + "</sheetData></worksheet>";
}
$("btnXlsx").onclick = () => {
  const classes = [...new Set(ALL.map((s) => s.c))].sort();
  const sheets = [["총괄", tableOf(ALL)]].concat(classes.map((c) => [(/^\d+$/.test(c) ? c + "반" : c).replace(/[\[\]:*?\/\\]/g, " ").slice(0, 31), tableOf(ALL.filter((s) => s.c === c))]));
  const NS = "http://schemas.openxmlformats.org/";
  const files = [
    ["[Content_Types].xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="' + NS + 'package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      sheets.map((_, i) => '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join("") + "</Types>"],
    ["_rels/.rels", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="' + NS + 'package/2006/relationships"><Relationship Id="rId1" Type="' + NS + 'officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
    ["xl/workbook.xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="' + NS + 'spreadsheetml/2006/main" xmlns:r="' + NS + 'officeDocument/2006/relationships"><sheets>' + sheets.map(([n], i) => '<sheet name="' + xe(n) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>').join("") + "</sheets></workbook>"],
    ["xl/_rels/workbook.xml.rels", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="' + NS + 'package/2006/relationships">' + sheets.map((_, i) => '<Relationship Id="rId' + (i + 1) + '" Type="' + NS + 'officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>').join("") +
      '<Relationship Id="rId' + (sheets.length + 1) + '" Type="' + NS + 'officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],
    ["xl/styles.xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="' + NS + 'spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="맑은 고딕"/></font><font><b/><sz val="11"/><name val="맑은 고딕"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFEFEFEF"/></patternFill></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="2"><xf/><xf fontId="1" fillId="2" applyFont="1" applyFill="1"/></cellXfs></styleSheet>']
  ].concat(sheets.map(([, t], i) => ["xl/worksheets/sheet" + (i + 1) + ".xml", sheetXml(t)]));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(zip(files));
  a.download = "수행평가_채점_" + new Date().toISOString().slice(0, 10) + ".xlsx";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};

load();
</script>
