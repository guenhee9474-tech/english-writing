<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수행평가 현황 (교사용)</title>
<meta name="referrer" content="no-referrer">
<!--
  선생님 현황 화면. 수업 중에 반 하나를 띄워 두고 보는 용도입니다.

  여는 법: 주소 뒤에 열쇠를 붙여야 열립니다.
      teacher.html?k=열쇠
  열쇠는 Apps Script 편집기에서 newTeacherKey() 를 한 번 실행하면 만들어지고,
  실행 로그에 완성된 주소가 찍힙니다. 그 주소를 북마크하세요.

  이 파일에는 열쇠가 들어 있지 않습니다(저장소가 공개라서).
  학생에게 이 주소를 알려 주지 마세요.
-->
<style>
  :root{
    --ink:#1B2436; --muted:#5D6675; --line:#DDE3EC; --bg:#F4F6FA; --card:#FFFFFF;
    --blue:#2C5FD6; --blue-soft:#E8EFFC;
    --amber:#B26A00; --amber-soft:#FFF2D6;
    --green:#0E7C66; --green-soft:#DDF2EC;
    --red:#B42318; --red-soft:#FDE9E7;
    --gray:#8A93A2; --gray-soft:#ECEFF3;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
       background:var(--bg); color:var(--ink); -webkit-text-size-adjust:100%}

  header{position:sticky; top:0; z-index:10; background:#1B2436; color:#fff; padding:10px 16px 0}
  .top{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .top h1{font-size:17px; margin:0; font-weight:700; letter-spacing:-0.2px}
  .fresh{font-size:13px; color:#B9C2D0; margin-left:auto; display:flex; align-items:center; gap:8px}
  .dot{width:8px; height:8px; border-radius:50%; background:#3DD68C; display:inline-block}
  .dot.stale{background:#F0A500}
  .dot.off{background:#E2564A}

  .tabs{display:flex; gap:6px; overflow-x:auto; padding:10px 0 0; -webkit-overflow-scrolling:touch}
  .tabs button{flex:0 0 auto; background:#2C3547; color:#C7CEDA; border:0; border-radius:8px 8px 0 0;
    padding:9px 16px; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit}
  .tabs button.on{background:var(--bg); color:var(--ink)}
  .tabs button .n{font-size:12px; color:#8A93A2; margin-left:6px; font-weight:500}
  .tabs button.on .n{color:var(--muted)}
  .tabs button.warn{color:#FFC9C4}
  .tabs button.warn.on{color:var(--red)}

  .bar{background:#fff; border-bottom:1px solid var(--line); padding:10px 16px;
       display:flex; gap:18px; align-items:center; flex-wrap:wrap; font-size:15px}
  .bar b{font-size:19px; font-weight:700; margin-left:4px}
  .bar .warnbox{color:var(--red); font-weight:700}
  .bar .sp{margin-left:auto; display:flex; gap:8px}
  .bar .sp button{border:1px solid var(--line); background:#fff; border-radius:8px; padding:7px 12px;
    font-size:14px; cursor:pointer; font-family:inherit; color:var(--muted)}
  .bar .sp button.on{background:var(--ink); color:#fff; border-color:var(--ink)}

  main{padding:14px}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:10px}

  .card{background:var(--card); border:1px solid var(--line); border-left:6px solid var(--gray);
        border-radius:12px; padding:11px 13px; min-height:104px; position:relative;
        display:flex; flex-direction:column; gap:3px}
  .card .nm{font-size:20px; font-weight:700; letter-spacing:-0.3px; line-height:1.2}
  .card .sid{font-size:12px; color:var(--muted)}
  .card .st{font-size:14px; font-weight:600; margin-top:2px}
  .card .sub{font-size:12px; color:var(--muted); margin-top:auto}
  .card .lv{position:absolute; top:9px; right:10px; background:var(--red); color:#fff;
    font-size:17px; font-weight:800; min-width:32px; height:32px; border-radius:16px;
    display:flex; align-items:center; justify-content:center; padding:0 8px}
  .card .flags{font-size:12px; color:var(--red); font-weight:600}

  .card.off{border-left-color:var(--gray); background:var(--gray-soft); opacity:.85}
  .card.off .nm{color:var(--muted); font-weight:600}
  .card.work{border-left-color:var(--blue)}
  .card.work .st{color:var(--blue)}
  .card.dr{border-left-color:var(--amber); background:var(--amber-soft)}
  .card.dr .st{color:var(--amber)}
  .card.done{border-left-color:var(--green); background:var(--green-soft)}
  .card.done .st{color:var(--green)}
  .card.leave{border-color:var(--red); border-left-color:var(--red); background:var(--red-soft)}
  .card.quiet{outline:2px dashed #E2564A; outline-offset:-3px}
  .card .take{margin-top:6px; border:1px solid var(--red); background:#fff; color:var(--red); border-radius:8px;
    padding:6px 8px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit}
  .card .take:disabled{opacity:.5; cursor:default}
  .closed{background:var(--red); color:#fff; padding:10px 16px; font-size:15px; font-weight:700}
  .card .more{position:absolute; right:8px; bottom:8px; border:0; background:transparent; color:var(--muted); font-size:18px; line-height:1;
    padding:4px 8px; border-radius:8px; cursor:pointer}
  .card .more:hover{background:var(--gray-soft); color:var(--ink)}
  .cmenu{position:fixed; z-index:50; min-width:220px; background:#fff; border:1px solid var(--line); border-radius:12px;
    box-shadow:0 10px 30px rgba(27,36,54,.18); padding:6px; display:flex; flex-direction:column}
  .cmenu[hidden], .tnote[hidden]{display:none}   /* display:flex 가 hidden 을 이기지 않게 (닫힌 메뉴가 클릭을 가로막았음) */
  .cmenu .who{font-size:13px; color:var(--muted); padding:6px 10px 4px}
  .cmenu button{border:0; background:transparent; text-align:left; padding:10px 12px; font-size:15px; border-radius:8px; cursor:pointer; font-family:inherit; color:var(--ink)}
  .cmenu button:hover, .cmenu button:focus{background:var(--blue-soft)}
  .cmenu button.danger{color:var(--red)}
  .tnote{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px;
    border-radius:999px; font-size:14px; z-index:60; max-width:90vw; text-align:center}

  .msg{background:#fff; border:1px solid var(--line); border-radius:12px; padding:22px; margin:16px;
       font-size:16px; line-height:1.7}
  .msg code{background:var(--gray-soft); padding:2px 6px; border-radius:5px; font-size:14px}
  .msg h2{margin:0 0 10px; font-size:19px}
  .empty{color:var(--muted); padding:30px 4px; font-size:16px}
  @media (max-width:520px){
    .grid{grid-template-columns:repeat(auto-fill, minmax(150px, 1fr))}
    .card .nm{font-size:18px}
  }
</style>
</head>
<body>

<header>
  <div class="top">
    <h1>수행평가 현황</h1>
    <a id="gradeLink" href="grade.html" style="color:#C7CEDA;font-size:14px;text-decoration:none;border:1px solid #3B475E;border-radius:8px;padding:4px 10px">채점</a>
    <div class="fresh"><span class="dot" id="dot"></span><span id="fresh">불러오는 중…</span></div>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<div class="closed" id="closed" hidden>2회차가 '모두 닫힘'으로 되어 있어 반을 열어도 시작되지 않습니다. Apps Script 편집기에서 autoFinal 을 실행하면 반별 열기로 돌아갑니다.</div>
<div class="bar" id="bar" hidden></div>
<div class="cmenu" id="cmenu" hidden role="menu"></div>
<div class="tnote" id="tnote" hidden role="status"></div>
<main><div id="body"></div></main>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzq2ub-CXiHUErkWcvN7YgPbNacIoDZZlT6jNsRSKB6G1nWOivxRzfjlAIp83kQdPvl4Q/exec";
const REFRESH_SEC = 3;          // 몇 초마다 다시 읽을지 (서버가 3초간 자료를 보관하므로 이보다 빨리 해도 소용없다)
const QUIET_MIN = 3;            // 이만큼 저장이 없으면 "조용함"으로 본다

const q = new URLSearchParams(location.search);
// 열쇠는 주소의 # 뒤(teacher.html#k=…)에 둡니다. # 뒤는 서버로 보내지지 않아 GitHub 기록 등에 남지 않습니다.
// 예전 주소(?k=…)로 열어도 되고, 열자마자 # 형태로 바꿔 둡니다(북마크를 다시 해 두면 좋습니다).
const KEY = q.get("k") || new URLSearchParams(location.hash.slice(1)).get("k") || "";
if (q.get("k")) { try { history.replaceState(null, "", location.pathname + "#k=" + encodeURIComponent(KEY)); } catch (e) {} }
const $ = (id) => document.getElementById(id);
$("gradeLink").href = "grade.html#k=" + encodeURIComponent(KEY);   // 같은 열쇠로 채점 화면 (# 뒤라 서버로 가지 않음)

let cls = q.get("cls") || localStorage.getItem("t_cls") || "";
let sortBy = localStorage.getItem("t_sort") || "sid";
let lastOk = 0, lastErr = "", loading = false, busy = false, tries = 0;

const LABEL = { research: "조사 중", draft: "초안 작성 중", draftDone: "초안 제출", final: "최종 작성 중", done: "최종 제출" };

/* 구글 쿠키를 보내지 않는 fetch 를 먼저 씁니다.
   쿠키를 보내면 구글이 계정을 고르려고 주소를 /macros/u/1/s/... 로 바꾸는데,
   그 계정에 권한이 없으면 "파일을 열 수 없습니다"가 뜨면서 화면이 안 뜹니다(2026-09-10 실제로 겪음).
   fetch 가 안 되면 예전 방식(JSONP)으로 한 번 더 시도합니다. */
async function ask(params, timeoutMs) {
  const q = new URLSearchParams(params);
  const ctl = ("AbortController" in window) ? new AbortController() : null;
  const timer = ctl ? setTimeout(() => ctl.abort(), timeoutMs || 15000) : null;
  try {
    const r = await fetch(SCRIPT_URL + "?" + q.toString(), { credentials: "omit", signal: ctl ? ctl.signal : undefined });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return JSON.parse(await r.text());
  } catch (e) {
    return await jsonp(params, timeoutMs);
  } finally { if (timer) clearTimeout(timer); }
}

function jsonp(params, timeoutMs) {
  return new Promise((resolve, reject) => {
    const cb = "tcb" + Date.now() + Math.floor(Math.random() * 1e6);
    const s = document.createElement("script");
    let done = false;
    const cleanup = () => { try { delete window[cb]; } catch (e) { window[cb] = undefined; } s.remove(); };
    window[cb] = (d) => { done = true; cleanup(); resolve(d); };
    s.onerror = () => { if (!done) { done = true; cleanup(); reject(new Error("load")); } };
    const p = new URLSearchParams(params); p.set("callback", cb);
    s.src = SCRIPT_URL + "?" + p.toString();
    document.head.appendChild(s);
    setTimeout(() => { if (!done) { done = true; cleanup(); reject(new Error("timeout")); } }, timeoutMs || 25000);
  });
}
// 서버가 무엇을 돌려주는지 눈으로 확인할 수 있는 주소 (문제가 생겼을 때 새 탭에서 열어 봅니다)
function rawUrl() {
  const p = new URLSearchParams({ action: "monitor", k: KEY, cls: cls || "" });
  return SCRIPT_URL + "?" + p.toString();
}

function ago(ms) {
  if (!ms) return "";
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 60) return s + "초 전";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "분 전";
  return Math.floor(m / 60) + "시간 " + (m % 60) + "분 전";
}
function clock(ms) {
  if (!ms) return "";
  const d = new Date(ms);
  return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
}
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function kindOf(st) {
  if (!st.ph) return "off";
  if (st.ph === "done") return "done";
  if (st.ph === "draftDone") return "dr";
  return "work";
}
function quiet(st) {
  if (!st.at) return 0;
  if (st.ph === "done" || st.ph === "draftDone" || !st.ph) return 0;
  const m = Math.floor((Date.now() - st.at) / 60000);
  return m >= QUIET_MIN ? m : 0;
}

function render(d) {
  $("closed").hidden = d.fo !== false;
  // 반 목록
  const tabs = $("tabs");
  const names = d.classes || [];
  if (!cls && names.length) cls = names[0];
  tabs.innerHTML = names.map((c) =>
    '<button data-c="' + esc(c) + '" class="' + (c === cls ? "on" : "") + '">' + esc(c) + "</button>").join("");
  Array.prototype.forEach.call(tabs.querySelectorAll("button"), (b) => {
    b.onclick = () => { cls = b.dataset.c; localStorage.setItem("t_cls", cls); load(true); };
  });

  const list = (d.students || []).slice();
  const on = list.filter((s) => s.ph).length;
  const leaved = list.filter((s) => s.lv > 0);
  const drafted = list.filter((s) => s.ph === "draftDone" || s.ph === "final" || s.ph === "done").length;
  const doneN = list.filter((s) => s.ph === "done").length;
  const quietN = list.filter((s) => quiet(s)).length;
  const rosterN = list.filter((s) => s.rm).length;

  const bar = $("bar");
  bar.hidden = false;
  bar.innerHTML =
    "<div>접속<b>" + on + " / " + list.length + "</b></div>" +
    "<div>초안 제출<b>" + drafted + "</b></div>" +
    "<div>최종 제출<b>" + doneN + "</b></div>" +
    '<div class="' + (leaved.length ? "warnbox" : "") + '">이탈<b>' + leaved.length + "명</b></div>" +
    (quietN ? '<div class="warnbox">조용함<b>' + quietN + "명</b></div>" : "") +
    (rosterN ? '<div class="warnbox">명단 확인<b>' + rosterN + "명</b></div>" : "") +
    finalBadge(d) +
    '<div class="sp">' +
      '<button id="classMenu" title="이 반 학생 모두에게 (2회차 열기·닫기 포함)">반 전체 ▾</button>' +
      '<button data-s="sid" class="' + (sortBy === "sid" ? "on" : "") + '">학번 순</button>' +
      '<button data-s="leave" class="' + (sortBy === "leave" ? "on" : "") + '">이탈 많은 순</button>' +
    "</div>";
  Array.prototype.forEach.call(bar.querySelectorAll("[data-s]"), (b) => {
    b.onclick = () => { sortBy = b.dataset.s; localStorage.setItem("t_sort", sortBy); render(lastData); };
  });

  if (sortBy === "leave") list.sort((a, b) => (b.lv - a.lv) || (b.hg - a.hg) || (Number(a.sid) - Number(b.sid)));
  else list.sort((a, b) => Number(a.sid) - Number(b.sid));

  if (!list.length) {
    $("body").innerHTML = '<div class="empty">이 반에서 아직 접속한 학생이 없습니다. "명단" 탭에 학번과 이름을 넣어 두면 미접속 학생도 여기 보입니다.</div>';
    return;
  }

  $("body").innerHTML = '<div class="grid">' + list.map((s) => {
    const qm = quiet(s);
    const cn = ["card", kindOf(s)];
    if (s.lv > 0) cn.push("leave");
    if (qm) cn.push("quiet");
    const flags = [];
    if (s.hg > 0) flags.push("한글 " + s.hg);
    if (s.bs > 0) flags.push("대량 " + s.bs);
    if (s.dup) flags.push("중복");
    if (s.od) flags.push("다른 기기 " + s.od);
    if (s.rm) flags.push("명단 확인: " + s.rm);
    if (s.ph === "draftDone" && ((lastData && lastData.openSid) || {})[s.sid] > Date.now()) flags.push("2회차 열림");
    let sub = "";
    if (!s.ph) sub = "아직 안 들어옴";
    else if (s.ph === "done") sub = "제출 " + clock(s.fn);
    else if (s.ph === "draftDone") sub = "초안 제출 " + clock(s.dr);
    else sub = (qm ? "⏸ " + qm + "분째 조용함" : ago(s.at) + " 저장") + (s.sn ? " · " + s.sn + "문장" : "");
    return '<div class="' + cn.join(" ") + '" data-sid="' + esc(s.sid) + '" data-ph="' + esc(s.ph) + '" data-nm="' + esc(s.nm) + '">' +
      (s.lv > 0 ? '<div class="lv">' + s.lv + "</div>" : "") +
      '<div class="nm">' + esc(s.nm || "(이름 없음)") + "</div>" +
      '<div class="sid">' + esc(s.sid) + "</div>" +
      '<div class="st">' + esc(LABEL[s.ph] || "미접속") + "</div>" +
      (flags.length ? '<div class="flags">' + esc(flags.join(" · ")) + "</div>" : "") +
      '<div class="sub">' + esc(sub) + "</div>" +
      (s.ph ? '<button class="more" data-more="' + esc(s.sid) + '" aria-label="' + esc(s.nm) + ' 조작" title="조작 (오른쪽 클릭과 같음)">⋯</button>' : "") +
      (s.kp ? '<button class="take" data-sid="' + esc(s.sid) + '" data-kp="' + esc(s.kp) + '" data-nm="' + esc(s.nm) + '" data-op="' + esc(LABEL[s.op] || s.op || "") + '">기존 기록 잇기 (' + esc(LABEL[s.op] || s.op || "") + ")</button>" : "") +
      "</div>";
  }).join("") + "</div>";
}

/* ── 학생 조작 (카드 오른쪽 클릭 또는 ⋯) ──
   고른 조작은 서버에 잠깐 맡겨 두고, 학생 화면이 20초 안에 가져가 적용합니다. 선생님 열쇠가 있어야 보낼 수 있습니다. */
const CMD_LABEL = { add5: "5분 더 주기", unlock: "잠금 풀고 5분 주기", todraft: "초안 쓰기 단계로 넘기기", submit: "지금 제출시키기", reopen: "제출 취소 (다시 열고 5분)", msg: "메시지 보내기",
                    openfinal: "2회차 열기 (3시간)", closefinal: "2회차 닫기" };
function cmdsFor(ph) {
  if (ph === "research") return ["add5", "todraft", "msg"];
  if (ph === "draft" || ph === "final") return ["add5", "unlock", "submit", "msg"];
  if (ph === "draftDone") return ["openfinal", "reopen", "msg"];
  if (ph === "done") return ["reopen", "msg"];
  return [];
}
let menuTarget = null;
function openMenu(target, x, y) {
  const m = $("cmenu");
  const list = target.cls ? ["openfinal", "closefinal", "add5", "todraft", "msg"] : cmdsFor(target.ph);
  if (!list.length) return;
  menuTarget = target;
  m.innerHTML = '<div class="who">' + esc(target.cls ? target.cls + " 전체 (들어와 있는 학생)" : target.sid + " " + target.nm + " · " + (LABEL[target.ph] || "")) + "</div>" +
    list.map((c) => '<button role="menuitem" data-cmd="' + c + '"' + (c === "submit" || c === "reopen" || c === "closefinal" ? ' class="danger"' : "") + ">" +
      (c === "openfinal" && !target.cls ? "이 학생 2회차 열기 (3시간)" : CMD_LABEL[c]) + "</button>").join("");
  m.hidden = false;
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(x, innerWidth - w - 8)) + "px";
  m.style.top = Math.max(8, Math.min(y, innerHeight - h - 8)) + "px";
  const first = m.querySelector("button"); if (first) first.focus();
}
function closeMenu() { $("cmenu").hidden = true; menuTarget = null; }
let tnoteTimer = null;
function tnote(msg) { const n = $("tnote"); n.textContent = msg; n.hidden = false; clearTimeout(tnoteTimer); tnoteTimer = setTimeout(() => { n.hidden = true; }, 5000); }
async function sendCmd(target, cmd) {
  let arg = "";
  const who = target.cls ? target.cls + " 전체" : target.sid + " " + target.nm;
  if (cmd === "msg") {
    arg = (prompt(who + "에게 보낼 메시지 (학생 화면에 안내창으로 뜹니다)", "") || "").trim();
    if (!arg) return;
  } else if (cmd === "submit" && !confirm(who + " 학생의 글을 지금 제출시킵니다. 계속할까요?")) return;
  else if (cmd === "reopen" && !confirm(who + " 학생의 제출을 취소하고 다시 열어 5분을 줍니다. 계속할까요?")) return;
  else if (target.cls && !confirm(who + "에게 '" + CMD_LABEL[cmd] + "'를 보냅니다. 계속할까요?")) return;
  tnote("보내는 중…");
  try {
    const q = { action: "tcmd", k: KEY, cmd: cmd, arg: arg };
    if (target.cls) q.cls = target.cls; else q.sid = target.sid;
    const r = await ask(q, 30000);
    if (r && r.ok && cmd === "openfinal") { tnote(who + "의 2회차를 열었습니다(3시간). 기다리던 학생 화면은 20초 안에 최종 글쓰기로 넘어갑니다."); load(true); }
    else if (r && r.ok && cmd === "closefinal") { tnote(who + "의 2회차를 닫았습니다. 쓰는 중인 학생은 그대로 두고, 새로 들어오는 학생부터 닫힙니다."); load(true); }
    else if (r && r.ok) tnote((target.cls ? r.n + "명에게 " : who + " 학생에게 ") + "'" + CMD_LABEL[cmd] + "'를 보냈습니다. 학생 화면에 20초 안에 반영됩니다.");
    else tnote("보내지 못했습니다: " + ((r && r.error) === "NO_TARGET" ? "보낼 학생이 없습니다" : (r && r.error) || "응답 없음"));
  } catch (e) { tnote("보내지 못했습니다. 잠시 뒤 다시 해 보세요."); }
}
document.addEventListener("contextmenu", (e) => {
  const card = e.target.closest(".card[data-sid]");
  if (!card || !card.dataset.ph) return;
  e.preventDefault();
  openMenu({ sid: card.dataset.sid, ph: card.dataset.ph, nm: card.dataset.nm }, e.clientX, e.clientY);
});
document.addEventListener("click", (e) => {
  const more = e.target.closest("[data-more]");
  if (more) {
    const card = more.closest(".card"); const r = more.getBoundingClientRect();
    e.stopPropagation();
    return openMenu({ sid: card.dataset.sid, ph: card.dataset.ph, nm: card.dataset.nm }, r.left, r.bottom + 4);
  }
  if (e.target.id === "classMenu") { const r = e.target.getBoundingClientRect(); return openMenu({ cls: cls }, r.left, r.bottom + 4); }
  const item = e.target.closest("#cmenu [data-cmd]");
  if (item && menuTarget) { const t = menuTarget; closeMenu(); return sendCmd(t, item.dataset.cmd); }
  if (!e.target.closest("#cmenu")) closeMenu();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });
window.addEventListener("scroll", closeMenu, true);

/* "중복" 카드의 기존 기록 잇기.
   학생 기기의 열쇠가 사라져(다른 아이패드, Safari 기록 삭제, 7일 넘게 안 들어옴 등) 새 줄로 시작한 학생을
   원래 줄(먼저 쓴 글)에 다시 연결합니다. 누른 뒤 그 학생에게 "새로고침하고 같은 학번·이름으로 다시 로그인"하라고 합니다. */
document.addEventListener("click", async (e) => {
  const b = e.target.closest(".take");
  if (!b || b.disabled) return;
  const msg = "학생이 직접 손을 들어 요청한 경우에만 누르세요. (다른 사람이 이 학생 이름으로 들어와 있을 수도 있습니다)\n\n" +
    b.dataset.sid + " " + b.dataset.nm + " 학생을 먼저 쓰던 기록(" + b.dataset.op + ")에 다시 연결합니다.\n" +
    "지금 이 기기에서 새로 쓴 내용은 버려집니다.\n\n연결한 뒤 학생에게 '새로고침 → 같은 학번·이름으로 로그인'하라고 알려 주세요.";
  if (!confirm(msg)) return;
  b.disabled = true; b.textContent = "연결하는 중…";
  try {
    const r = await ask({ action: "takeover", k: KEY, sid: b.dataset.sid, kp: b.dataset.kp }, 30000);
    if (r && r.ok) { alert("연결했습니다. 학생에게 새로고침 후 같은 학번·이름으로 다시 로그인하라고 알려 주세요."); load(true); }
    else alert("연결하지 못했습니다: " + ((r && r.error) || "응답 없음") + "\n(NO_ORIGINAL: 같은 이름의 원래 기록이 없음 / DUP_AHEAD: 이 기기 쪽 글이 더 앞서 있어 잇지 않음)");
  } catch (err) { alert("연결하지 못했습니다. 잠시 뒤 다시 눌러 보세요."); }
  finally { b.disabled = false; }
});

let lastData = null;
// 이 반의 2회차(최종 글쓰기) 상태: 선생님이 열어야 시작, 연 뒤 3시간 동안만
function finalBadge(d) {
  if (d.fmode === "all") return '<div>2회차<b>모두 열림</b></div>';
  if (d.fmode === "none") return '<div class="warnbox">2회차<b>모두 닫힘</b></div>';
  const until = (d.openCls || {})[cls];
  return until && until > Date.now() ? '<div>2회차<b style="color:var(--green)">열림 ~' + clock(until) + "</b></div>"
                                     : '<div>2회차<b>닫힘</b></div>';
}

function showMsg(html) { $("body").innerHTML = '<div class="msg">' + html + "</div>"; $("bar").hidden = true; }

async function load(immediate) {
  if (busy) return;
  busy = true; loading = true; tries++; tickFresh();
  try {
    const d = await ask({ action: "monitor", k: KEY, cls: cls });
    if (!d || d.error) {
      if (d && d.error === "NO_TEACHER_KEY") {
        showMsg("<h2>아직 준비가 안 되었습니다</h2>Apps Script 편집기에서 <code>newTeacherKey()</code>를 한 번 실행하세요. " +
                "실행 로그에 이 화면의 주소가 찍힙니다. 그 주소를 북마크해서 여세요.");
      } else if (d && d.error === "BAD_KEY") {
        showMsg("<h2>열쇠가 맞지 않습니다</h2>주소 뒤의 <code>?k=…</code> 부분이 빠졌거나 예전 것입니다. " +
                "편집기에서 <code>newTeacherKey()</code>를 실행해 나온 주소로 다시 여세요.");
      } else {
        showMsg("<h2>읽지 못했습니다</h2>" + esc((d && d.error) || "알 수 없는 오류") + "<br>잠시 뒤 다시 시도합니다.");
      }
      lastErr = (d && d.error) || "unknown";
      return;
    }
    lastData = d;
    lastOk = Date.now();
    lastErr = "";
    render(d);
  } catch (e) {
    lastErr = (e && e.message) || String(e);
    // 한 번도 성공한 적이 없으면 빈 화면으로 두지 않고 이유를 보여 줍니다.
    if (!lastOk) showFail();
  } finally { busy = false; loading = false; tickFresh(); }
}

// 연결이 안 될 때: 무엇을 해 보면 되는지까지 화면에 적어 둡니다.
function showFail() {
  const why = lastErr === "timeout"
    ? "서버가 25초 안에 답하지 않았습니다."
    : "브라우저가 서버 응답을 불러오지 못했습니다. (" + esc(lastErr) + ")";
  showMsg("<h2>선생님 서버에 연결하지 못했습니다</h2>" + why +
    "<br><br><b>이렇게 확인해 보세요.</b><br>" +
    '1. <a href="' + esc(rawUrl()) + '" target="_blank" rel="noopener">이 주소를 새 탭에서 열어 보세요</a>. ' +
    "글자로 된 자료(<code>cb({\"ok\":true…</code>)가 보이면 서버는 정상이고 이 브라우저가 막고 있는 것입니다. " +
    "구글 로그인 화면이 뜨면 로그인한 뒤 이 화면을 새로고침하세요.<br>" +
    "2. 시크릿 창이나 다른 브라우저에서 이 화면을 열어 보세요.<br>" +
    "3. 그래도 안 되면 학교 네트워크가 <code>script.googleusercontent.com</code> 을 막고 있을 수 있습니다.<br><br>" +
    '<button id="again" style="font-size:16px;padding:10px 18px;border-radius:8px;border:1px solid #1B2436;background:#1B2436;color:#fff;cursor:pointer">다시 시도</button> ' +
    '<span style="color:#5D6675;font-size:14px;margin-left:10px">' + tries + "번 시도했습니다</span>");
  const a = $("again"); if (a) a.onclick = () => { lastErr = ""; showMsg("<h2>다시 불러오는 중…</h2>"); load(true); };
}

// 상태 표시는 실제 상태만 말합니다. (예전에는 한 번도 성공하지 못했는데도 초록불에 "방금 갱신"이 떴습니다.)
function tickFresh() {
  const dot = $("dot"), t = $("fresh");
  if (!lastOk) {
    t.textContent = loading ? "불러오는 중…" : (lastErr ? "연결 안 됨" : "대기 중");
    dot.className = "dot " + (loading ? "stale" : "off");
    return;
  }
  const s = Math.round((Date.now() - lastOk) / 1000);
  t.textContent = (s < 5 ? "방금" : s + "초 전") + " 갱신 · " + REFRESH_SEC + "초마다";
  dot.className = "dot" + (lastErr ? " off" : s > REFRESH_SEC * 3 ? " stale" : "");
}

if (!KEY) {
  showMsg("<h2>열쇠가 필요합니다</h2>이 화면은 학생 현황이 보이므로 주소에 열쇠가 있어야 열립니다.<br><br>" +
          "Apps Script 편집기에서 <code>newTeacherKey()</code>를 한 번 실행하면 실행 로그에 " +
          "<code>…teacher.html?k=…</code> 주소가 찍힙니다. 그 주소를 북마크해서 여세요.");
} else {
  load(true);
  setInterval(load, REFRESH_SEC * 1000);
  // 총괄 탭 다시 쓰기·빠진 PDF 채우기는 1분마다 따로 부릅니다(기다리지 않음). 3초 새로 읽기가 그 일 때문에 멈추지 않게.
  const ovTick = () => { ask({ action: "ovtick", k: KEY }, 120000).catch(() => {}); };
  setTimeout(ovTick, 15000);
  setInterval(ovTick, 60000);
  setInterval(tickFresh, 1000);
  // 화면을 다시 보면 바로 한 번 읽습니다
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(true); });
}
</script>
</body>
</html>
